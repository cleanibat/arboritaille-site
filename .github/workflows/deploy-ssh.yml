name: Déploiement SSH (rsync)

# Hostinger (plan Business de Robin Humbert, SSH port 65002, docroot domains/arboritaille.ch/public_html/). Inactif tant que la variable de dépôt DEPLOY ne vaut pas « on ».
# Le site est généré en local (python3 build.py) et les .html sont versionnés : rsync publie la racine du dépôt sans les fichiers de travail.
# Secrets à créer sur le dépôt : SSH_HOST, SSH_PORT, SSH_USER, SSH_KEY (clé privée), SSH_KNOWN_HOSTS (ssh-keyscan), SSH_TARGET_DIR (docroot, finit par /), SITE_URL
# Optionnel : AGENCE_CONFIG (contenu JSON de agence_arboritaille.json, déposé hors docroot dans ../prive_arboritaille/)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.DEPLOY == 'on' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Synchroniser les fichiers
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            --exclude '.git' --exclude '.github' --exclude '*.py' --exclude 'data' --exclude 'tools' \
            --exclude 'content' --exclude 'docs' --exclude '.claude' --exclude 'img/carte-zone.svg.html' \
            --exclude 'README.md' --exclude '.nojekyll' --exclude '.DS_Store' --exclude '.gitignore' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_TARGET_DIR }}
      - name: Déposer la configuration Make hors docroot
        env:
          AGENCE_CONFIG: ${{ secrets.AGENCE_CONFIG }}
        if: ${{ env.AGENCE_CONFIG != '' }}
        run: |
          printf '%s' "$AGENCE_CONFIG" > agence.json
          T="${{ secrets.SSH_TARGET_DIR }}"; P="$(dirname "${T%/}")/prive_arboritaille"
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p '$P' && chmod 700 '$P'"
          scp -i ~/.ssh/deploy_key -P ${{ secrets.SSH_PORT }} agence.json ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:"$P/agence_arboritaille.json"
          rm agence.json
      - name: Vérifier la mise en ligne
        run: |
          sleep 5
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" "${{ secrets.SITE_URL }}" || true
